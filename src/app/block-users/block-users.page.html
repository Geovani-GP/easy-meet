<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab4"></ion-back-button>
    </ion-buttons>
    <ion-title>{{translate('usuarios-bloqueados')}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{translate('usuarios-bloqueados')}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ng-container *ngFor="let user of blockedUsers">
    <div class="user-card" (click)="openModal(user)">
      <img [src]="user.img ? user.img : 'assets/no_image.png'" alt="Perfil" class="user-image" />
      <div class="user-info">
        <p class="user-alias">{{user.alias}}</p>
      </div>
    </div>
  </ng-container>
</ion-content>

<ion-modal [isOpen]="isModalOpen" (ionModalDidClose)="resetModal()" backdropDismiss="false">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Usuario bloqueado</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="isModalOpen = false">{{translate('cerrar')}}</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="user-card">
        <img [src]="selectedUser?.img ? selectedUser.img : 'assets/no_image.png'" alt="Perfil" class="user-image" />
        <p class="user-alias">{{selectedUser?.alias}}</p>
      </div>
      <ion-button expand="full" color="danger" (click)="selectedUser?.uid ? unblockUser(selectedUser.uid) : null">Desbloquear</ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
